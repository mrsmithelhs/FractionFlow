<!doctype html><meta charset="utf-8"><title>Disposable Plan 85 bridge probe</title><style>
:root{font:100%/1.45 system-ui;color:#14213d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:16px}.card{max-width:54rem;margin:auto;background:white;border:1px solid #d7deea;border-radius:12px;padding:20px}.plan84-options{display:flex;flex-wrap:wrap;gap:.75rem;margin:1rem 0;border:0;padding:0}.plan84-option{display:flex;align-items:center;gap:.5rem;min-width:4.5rem;min-height:2.75rem;padding:.4rem;border:1px solid #9aa9bf;border-radius:8px}.plan84-option input{width:1.25rem;height:1.25rem}.frame{margin:1.5rem 1.25rem}.axis{position:relative;height:.2rem;background:currentColor;margin:2rem 0 3.6rem}.tick{position:absolute;top:-.4rem;height:1rem;border-left:2px solid currentColor}.benchmark{position:absolute;top:1rem;transform:translateX(-50%)}.marker{position:absolute;top:-.5rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#245c73;transform:translateX(-50%)}.equality{display:flex;align-items:center;gap:.5rem;justify-content:center}.connector{position:absolute;top:.6rem;left:0;width:100%;height:3rem;overflow:visible;pointer-events:none}button{min-height:44px;padding:.6rem 1rem;font:inherit;margin:.25rem}.hidden{display:none}.linear-axis{padding:.75rem;background:#eaf1ff;border-radius:8px}.explain{margin-top:1.5rem}#status{min-height:1.5em}
</style><main class="card"><h1>Disposable bridge probe</h1><div id="prompt"></div><fieldset class="plan84-options" id="opts"></fieldset><p id="status" aria-live="polite"></p><button id="check">Check</button><button id="toggle">Switch to linear</button><section id="result" class="hidden"></section></main><script>
const P=new URLSearchParams(location.search),d=+(P.get('d')||10),w=+(P.get('w')||2),max=+(P.get('max')||w+1),n=+(P.get('n')||9),sparse=P.get('sparse')==='1',mode={linear:false};let selected=null,accepted=false;const val=w*d+n, prompt=document.querySelector('#prompt'),opts=document.querySelector('#opts'),result=document.querySelector('#result');prompt.textContent=`${w} ${n}/${d}: Which fraction names the same amount?`;let choices=[val-1,val,val+1,val+2].filter(x=>x>=0&&x<=max*d);while(choices.length<4){let x=choices[0]-1;if(x<0)x=choices.at(-1)+1;if(x<=max*d&&!choices.includes(x))choices.unshift(x);else break}if(choices.length!==4||new Set(choices).size!==4||choices.filter(x=>x===val).length!==1)throw Error("candidate range invalid");choices.forEach((x,i)=>{let l=document.createElement('label');l.className='plan84-option';l.innerHTML=`<input type="radio" name="choice" value="${i}"><span>${x}/${d}</span>`;opts.append(l)});opts.onchange=e=>selected=+e.target.value;function paint(){document.querySelector('#toggle').textContent=mode.linear?'Switch to visual':'Switch to linear';if(!accepted)return;result.classList.remove('hidden');let exact=`${w} ${n}/${d} = ${val}/${d}`;if(mode.linear){result.innerHTML=`<p class="equality">${exact}</p><p class="linear-axis">On a number line from 0 to ${max}, whole-number marks show ${Array.from({length:max+1},(_,i)=>i).join(" and ")}. Each whole interval is equal. Both forms name the same point.</p><p class="explain">${w===1?"1 whole is":`${w} wholes are`} ${w*d}/${d}. Add ${n}/${d}: ${w*d}/${d} + ${n}/${d} = ${val}/${d}. The point is ${val}/${d} on the number line.</p>`;return}let ticks='';for(let i=0;i<=max*d;i++){if(sparse&&i%d!==0&&i!==w*d+n)continue;ticks+=`<span class="tick" style="left:${i/(max*d)*100}%">${i%d===0?`<b class="benchmark">${i/d}</b>`:''}</span>`}result.innerHTML=`<div class="frame"><div class="axis">${ticks}<span class="marker" style="left:${(w*d+n)/(max*d)*100}%"></span><svg class="connector" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${(w*d+n)/(max*d)*100},0 50,100" fill="none" stroke="#245c73" stroke-width="2"/></svg></div><p class="equality">${exact}</p></div><p class="explain">${w===1?"1 whole is":`${w} wholes are`} ${w*d}/${d}. Add ${n}/${d}: ${w*d}/${d} + ${n}/${d} = ${val}/${d}. The point is ${val}/${d} on the number line.</p>`}document.querySelector('#check').onclick=()=>{if(selected===null){document.querySelector('#status').textContent='Choose a fraction first.';return}if(choices[selected]!==val){document.querySelector('#status').textContent='Check your choice and try again.';accepted=false;result.classList.add('hidden');return}accepted=true;document.querySelector('#status').textContent='Accepted';paint()};document.querySelector('#toggle').onclick=()=>{mode.linear=!mode.linear;paint()};window.probeState=()=>({selected,accepted,linear:mode.linear,choices:[...choices],correctIndex:choices.indexOf(val),rangeEnd:max*d,wholeCountExplanation:`${w===1?"1 whole is":`${w} wholes are`} ${w*d}/${d}; ${w*d}/${d} + ${n}/${d} = ${val}/${d}.`});
</script>
